# Makes a release, on a tag vX.Y.Z a maintainer pushes on the merge of
# the pull request that prepared it, and on nothing else: no push, no
# pull request and no schedule makes one. A run started by hand from the
# Actions page is a dry run, which builds and checks exactly as a tag
# does and publishes nothing. No version is typed here: release.js reads
# it from package.json, refuses a tag that differs and a version with no
# section in CHANGELOG.md, and takes from that section's heading whether
# the release is a pre-release, which it must be while the Snello it
# needs, package.json's snello.minimum, is one.
#
# The release holds the extension twice, snello-X.Y.Z.vsix and
# snello.vsix, the second a name a developer's script can rely on;
# SHA256SUMS of both; and build provenance for each, which
# `gh attestation verify` checks. The notes are the version's section
# of CHANGELOG.md. The Marketplace and Open VSX are not published to;
# their steps are left off below until they are.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # a dry run: built and checked as a tag is, published never

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Check, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release and its files
      id-token: write # the provenance's signing identity
      attestations: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Each module parses
        run: for f in *.js release/*.js test/*.js; do node --check "$f"; done
      - name: Test
        run: npm test
      - name: Check the version, the tag and the kind of release
        id: version
        run: |
          if [ "$PUBLISH" = true ]; then
            node release/release.js check "$GITHUB_REF_NAME"
          fi
          echo "version=$(node release/release.js version)" >> "$GITHUB_OUTPUT"
          echo "kind=$(node release/release.js kind)" >> "$GITHUB_OUTPUT"
          node release/release.js notes > "$RUNNER_TEMP/notes.md"
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KIND: ${{ steps.version.outputs.kind }}
        run: |
          if [ "$KIND" = pre-release ]; then
            npm run package -- --pre-release
          else
            npm run package
          fi
          cp bin/snello.vsix "bin/snello-$VERSION.vsix"
          (cd bin && sha256sum "snello-$VERSION.vsix" snello.vsix > SHA256SUMS)
          cat bin/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: bin/*.vsix
      - name: Publish the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          KIND: ${{ steps.version.outputs.kind }}
        run: |
          flag=""
          if [ "$KIND" = pre-release ]; then
            flag=--prerelease
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $flag \
            "bin/snello-$VERSION.vsix" bin/snello.vsix bin/SHA256SUMS
      # The Marketplace is not published to: the step stays here, off, until it is.
      # - name: Publish to the Marketplace
      #   if: env.PUBLISH == 'true'
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
      #     KIND: ${{ steps.version.outputs.kind }}
      #   run: |
      #     if [ -z "$VSCE_PAT" ]; then
      #       echo "No VSCE_PAT secret: the Marketplace is not published to."
      #       exit 0
      #     fi
      #     flag=""
      #     if [ "$KIND" = pre-release ]; then
      #       flag=--pre-release
      #     fi
      #     npx --yes @vscode/vsce@4.1.1 publish --packagePath bin/snello.vsix $flag
      # Open VSX is not published to: the step stays here, off, until it is.
      # - name: Publish to Open VSX
      #   if: env.PUBLISH == 'true'
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
      #     KIND: ${{ steps.version.outputs.kind }}
      #   run: |
      #     if [ -z "$OVSX_PAT" ]; then
      #       echo "No OVSX_PAT secret: Open VSX is not published to."
      #       exit 0
      #     fi
      #     flag=""
      #     if [ "$KIND" = pre-release ]; then
      #       flag=--pre-release
      #     fi
      #     npx --yes ovsx@1.4.0 publish bin/snello.vsix $flag
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snello-vsix
          path: |
            bin/*.vsix
            bin/SHA256SUMS
          if-no-files-found: error
